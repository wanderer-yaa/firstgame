<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg">
  <title>物品图标风格基准</title>
  <desc>单色墨线加一点朱砂的修仙物品图标，含 100px 展示与 28px 实际尺寸预览</desc>
  <defs>
    <g id="stroke-base" fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <symbol id="ic-lingzhi" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16,52 Q20,26 40,20 Q60,14 78,26 Q86,34 84,50 Q74,44 66,52 Q58,44 50,52 Q42,44 34,52 Q24,44 16,52 Z"/>
        <path d="M50,54 Q48,68 46,78"/>
        <path d="M34,82 Q46,74 60,80"/>
      </g>
    </symbol>

    <symbol id="ic-fruit" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="58" r="25"/>
        <path d="M50,33 L50,19"/>
        <path d="M50,26 Q68,15 75,28 Q60,35 50,26 Z"/>
      </g>
      <circle cx="41" cy="50" r="4" fill="#a8342a"/>
    </symbol>

    <symbol id="ic-jade" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32,26 L68,26 L80,50 L50,86 L20,50 Z"/>
        <path d="M32,26 L50,50 L68,26"/>
        <path d="M50,50 L50,86"/>
      </g>
      <circle cx="59" cy="63" r="3" fill="#a8342a"/>
    </symbol>

    <symbol id="ic-bottle" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M42,25 L58,25 L58,40 Q76,48 76,64 Q76,84 50,84 Q24,84 24,64 Q24,48 42,40 Z"/>
        <path d="M38,18 L62,18"/>
        <path d="M42,54 Q50,60 58,54"/>
      </g>
    </symbol>

    <symbol id="ic-pill" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="52" r="26"/>
        <path d="M50,52 Q62,44 64,56 Q66,70 50,70 Q32,70 32,52 Q32,34 50,32"/>
      </g>
      <circle cx="50" cy="52" r="3.5" fill="#a8342a"/>
    </symbol>

    <symbol id="ic-stone" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50,14 L74,36 L66,82 L34,82 L26,36 Z"/>
        <path d="M26,36 L50,52 L74,36"/>
        <path d="M50,52 L50,82"/>
      </g>
    </symbol>

    <symbol id="ic-scroll" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="28" y="22" width="12" height="60"/>
        <rect x="44" y="22" width="12" height="60"/>
        <rect x="60" y="22" width="12" height="60"/>
        <path d="M24,36 L76,36"/>
        <path d="M24,68 L76,68"/>
      </g>
    </symbol>

    <symbol id="ic-coin" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="28"/>
        <rect x="40" y="40" width="20" height="20"/>
      </g>
    </symbol>

    <symbol id="ic-talisman" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="32" y="14" width="36" height="72" rx="2"/>
        <path d="M42,32 Q58,40 42,48 Q58,56 42,64 Q52,70 46,76"/>
      </g>
      <circle cx="50" cy="24" r="3" fill="#a8342a"/>
    </symbol>

    <symbol id="ic-hoe" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30,14 L56,64"/>
        <path d="M56,64 L85,49 L90,60 L61,75 Z"/>
      </g>
      <path d="M35,28 L43,32" stroke="#a8342a" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="ic-rock" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20,72 Q24,46 44,40 Q66,34 78,54 Q88,70 74,79 L30,81 Q18,78 20,72 Z"/>
        <path d="M38,52 Q48,47 56,56"/>
      </g>
    </symbol>

    <symbol id="ic-spring" viewBox="0 0 100 100">
      <g fill="none" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50,16 Q74,46 74,60 A24,24 0 0 1 26,60 Q26,46 50,16 Z"/>
        <path d="M28,86 Q50,78 72,86"/>
      </g>
    </symbol>
  </defs>

  <rect width="900" height="680" fill="#f4efe3"/>
  <rect width="900" height="680" fill="none" stroke="#c9c0ad" stroke-width="1"/>

  <text x="50" y="34" font-family="SimSun, Songti SC, serif" font-size="17" fill="#2b2a26">物品图标 · 单色墨线 + 一点朱砂</text>

  <g>
    <use href="#ic-lingzhi" x="100" y="70" width="100" height="100"/>
    <use href="#ic-fruit" x="300" y="70" width="100" height="100"/>
    <use href="#ic-jade" x="500" y="70" width="100" height="100"/>
    <use href="#ic-bottle" x="700" y="70" width="100" height="100"/>

    <use href="#ic-pill" x="100" y="250" width="100" height="100"/>
    <use href="#ic-stone" x="300" y="250" width="100" height="100"/>
    <use href="#ic-scroll" x="500" y="250" width="100" height="100"/>
    <use href="#ic-coin" x="700" y="250" width="100" height="100"/>

    <use href="#ic-talisman" x="100" y="430" width="100" height="100"/>
    <use href="#ic-hoe" x="300" y="430" width="100" height="100"/>
    <use href="#ic-rock" x="500" y="430" width="100" height="100"/>
    <use href="#ic-spring" x="700" y="430" width="100" height="100"/>
  </g>

  <g font-family="SimSun, Songti SC, serif" font-size="14" fill="#5f5c53" text-anchor="middle">
    <text x="150" y="196">灵芝</text>
    <text x="350" y="196">朱果</text>
    <text x="550" y="196">玉髓</text>
    <text x="750" y="196">丹瓶</text>
    <text x="150" y="376">聚气丹</text>
    <text x="350" y="376">灵石</text>
    <text x="550" y="376">功法竹简</text>
    <text x="750" y="376">铜钱</text>
    <text x="150" y="556">符纸</text>
    <text x="350" y="556">药锄</text>
    <text x="550" y="556">青石</text>
    <text x="750" y="556">灵泉</text>
  </g>

  <line x1="50" y1="586" x2="850" y2="586" stroke="#c9c0ad" stroke-width="1"/>
  <text x="50" y="628" font-family="SimSun, Songti SC, serif" font-size="13" fill="#5f5c53">实际尺寸 28px：</text>

  <g>
    <use href="#ic-lingzhi" x="196" y="606" width="28" height="28"/>
    <use href="#ic-fruit" x="232" y="606" width="28" height="28"/>
    <use href="#ic-jade" x="268" y="606" width="28" height="28"/>
    <use href="#ic-bottle" x="304" y="606" width="28" height="28"/>
    <use href="#ic-pill" x="340" y="606" width="28" height="28"/>
    <use href="#ic-stone" x="376" y="606" width="28" height="28"/>
    <use href="#ic-scroll" x="412" y="606" width="28" height="28"/>
    <use href="#ic-coin" x="448" y="606" width="28" height="28"/>
    <use href="#ic-talisman" x="484" y="606" width="28" height="28"/>
    <use href="#ic-hoe" x="520" y="606" width="28" height="28"/>
    <use href="#ic-rock" x="556" y="606" width="28" height="28"/>
    <use href="#ic-spring" x="592" y="606" width="28" height="28"/>
  </g>

  <text x="650" y="626" font-family="SimSun, Songti SC, serif" font-size="12" fill="#8b8578">← 这一行才是玩家实际看到的大小</text>
</svg>
